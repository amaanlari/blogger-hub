# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys Blogger Hub as a single Docker web service running the `staging` profile. Every backing
# service is managed and external:
#
#   MongoDB  -> Atlas          Kafka -> Aiven (SASL_SSL / SCRAM-SHA-256)
#   Redis    -> Redis Cloud    Media -> Cloudinary
#
# The container therefore runs one process and needs no disk, no sidecar and no internal ports.
# The whole build and run recipe lives in the Dockerfile; there is no entrypoint script.
#
# This file is a convenience, not a requirement: you can equally create the service by hand in the
# dashboard (New -> Web Service -> Docker) and set the same variables there.
#
# To deploy: push this file, then Render Dashboard -> New -> Blueprint -> pick this repo.
#
# ---------------------------------------------------------------------------------------------
# BEFORE THE FIRST DEPLOY — two Secret Files (Dashboard -> service -> Environment -> Secret Files)
# ---------------------------------------------------------------------------------------------
#   ca.pem                     The Aiven CA certificate (Aiven console -> Kafka service ->
#                              "CA Certificate"). Required: the Kafka client will not connect
#                              without it. The path is preset in the Dockerfile.
#
#   application-staging.yaml   Optional but recommended. Upload your local
#                              src/main/resources/application-staging.yaml verbatim and every
#                              `sync: false` var below can be left unset — the Dockerfile points
#                              SPRING_CONFIG_ADDITIONAL_LOCATION at it, so Spring layers it on top
#                              of the JAR's application.yaml. One upload instead of fifteen
#                              dashboard fields, and nothing sensitive is typed into the Blueprint.
#
# Env vars still win over the secret file, so you can override a single value from the dashboard
# without re-uploading.
#
# Also whitelist Render's outbound IPs in Atlas (Network Access) and Aiven (Allowed IP addresses),
# or allow 0.0.0.0/0 on both.

services:
  - type: web
    name: blogger-hub
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore          # nearest to the ap-south-1 Redis / Aiven cluster; also: oregon, frankfurt, ohio, virginia
    plan: starter              # 512MB. Bump to `standard` if you see the JVM get OOM-killed.
    branch: main
    healthCheckPath: /actuator/health

    envVars:
      # --- Profile & JVM ----------------------------------------------------------------------
      - key: SPRING_PROFILES_ACTIVE
        value: staging
      # MaxRAMPercentage rather than a fixed -Xmx so the same image is correct on any plan.
      - key: JAVA_OPTS
        value: -XX:+UseContainerSupport -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError

      # --- Kafka (Aiven) ------------------------------------------------------------------------
      # Path to the uploaded Secret File; Render mounts secret files at /etc/secrets/<filename>.
      - key: KAFKA_SSL_TRUSTSTORE_PATH
        value: /etc/secrets/ca.pem
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false            # e.g. blogger-hub-<project>.aivencloud.com:10419
      - key: AIVEN_KAFKA_PASSWORD
        sync: false            # the avnadmin SCRAM password
      - key: KAFKA_TOPIC_NOTIFICATIONS
        value: blogger-hub-notifications
      - key: KAFKA_CONSUMER_GROUP_ID
        value: blogger-hub-notifications-consumer

      # --- MongoDB (Atlas) ----------------------------------------------------------------------
      - key: MONGODB_URI
        sync: false

      # --- Redis --------------------------------------------------------------------------------
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_USERNAME
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: OTP_TTL
        value: "5"

      # --- JWT ----------------------------------------------------------------------------------
      # Generate fresh values before going public: `openssl rand -hex 128`. Do not reuse the ones
      # in application-staging.yaml — they have been sitting in plain text on disk.
      - key: ACCESS_TOKEN_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: ACCESS_TOKEN_EXPIRATION_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRATION_DAYS
        value: "7"

      # --- Cloudinary ---------------------------------------------------------------------------
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_DEFAULT_PROFILE_PIC
        sync: false

      # --- Mail (SMTP) --------------------------------------------------------------------------
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

      # --- Gmail API ----------------------------------------------------------------------------
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
