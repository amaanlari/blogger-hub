# Configuration file for the example environment.

# MongoDB configuration
MONGODB_USERNAME: your_mongodb_username
MONGODB_PASSWORD: your_mongodb_password
MONGODB_URI: your_mongodb_uri
# Localhost-> (mongodb://localhost:27017/blogger_hub_db)
# Docker-> (mongodb://mongodb:27017/blogger_hub_db)
# Atlas-> (mongodb+srv://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@cluster0.xxxxx.mongodb.net/blogger_hub_db?retryWrites=true&w=majority&appName=Cluster0)

# JWT configuration
ACCESS_TOKEN_SECRET: jwt_access_token_secret
REFRESH_TOKEN_SECRET: jwt_refresh_token_secret
ACCESS_TOKEN_EXPIRATION_MINUTES: access_token_expiration_minutes # 15
REFRESH_TOKEN_EXPIRATION_DAYS: refresh_token_expiration_days # 7

# Cloudinary configuration
CLOUDINARY_CLOUD_NAME: lp-blogger-hub-dev
CLOUDINARY_API_KEY: 999999999999999
CLOUDINARY_API_SECRET: xxxxxxxxxxxxxxxxxx
CLOUDINARY_DEFAULT_PROFILE_PIC: https://res.cloudinary.com/lp-blogger-hub-dev/image/upload/v1734661609/blogger_hub/default-profile-pic.jpg

# Mail configuration
MAIL_HOST: smtp.gmail.com
MAIL_PORT: 587
MAIL_USERNAME: example@gmail.com
MAIL_PASSWORD: xxxx xxxx xxxx xxxx

# Redis configuration
REDIS_HOST: localhost
REDIS_PORT: 6379

# Redis OTP configuration
OTP_TTL: 2