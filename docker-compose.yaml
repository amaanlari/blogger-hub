version: '3.8'

services:
  mongodb:
    image: mongo
    container_name: mongodb
    ports:
      - "27017:27017"

  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"

  blogger-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blogger-hub-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${ACTIVE_PROFILE}
    ports:
      - "8080:8080"
    links:
      - mongodb
      - redis
