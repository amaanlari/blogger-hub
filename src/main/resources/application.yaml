spring:
  application:
    name: blogger-hub

  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: true
  kafka:
    ssl:
      trust-store-location: ${KAFKA_SSL_TRUSTSTORE_PATH}
#      key-store-location: ${KAFKA_SSL_KEYSTORE_PATH}
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: SCRAM-SHA-256
      ssl.truststore.type: PEM
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="avnadmin" password="${AIVEN_KAFKA_PASSWORD}";
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:blogger-hub-notifications}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    topic:
      notifications: ${KAFKA_TOPIC_NOTIFICATIONS:blogger-hub-notifications}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      # Boot's defaults (1MB per file, 10MB per request) reject most photos straight off a phone,
      # which is the common case for both post banners and avatars.
      max-file-size: 5MB
      max-request-size: 10MB

jwt:
  auth:
    accessTokenSecret: ${ACCESS_TOKEN_SECRET}
    refreshTokenSecret: ${REFRESH_TOKEN_SECRET}
    refreshTokenExpirationDays: ${REFRESH_TOKEN_EXPIRATION_DAYS}
    accessTokenExpirationMinutes: ${ACCESS_TOKEN_EXPIRATION_MINUTES}

cloudinary:
  cloud:
    name: ${CLOUDINARY_CLOUD_NAME}
    default-profile-pic: ${CLOUDINARY_DEFAULT_PROFILE_PIC}
  api:
    key: ${CLOUDINARY_API_KEY}
    secret: ${CLOUDINARY_API_SECRET}

server:
  port: ${PORT:8080}

otp:
  ttl: ${OTP_TTL:1}

gmail:
  credentials-file-path: ${CREDENTIALS_FILE_PATH:./credentials.json}
  clientId: ${GMAIL_CLIENT_ID}
  clientSecret: ${GMAIL_CLIENT_SECRET}
  refreshToken: ${GMAIL_REFRESH_TOKEN}
