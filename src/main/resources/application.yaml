spring:
  application:
    name: blogger-hub

  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}

  kafka:
    ssl:
      trust-store-location: ${KAFKA_SSL_TRUSTSTORE_PATH}
      key-store-location: ${KAFKA_SSL_KEYSTORE_PATH}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:blogger-hub-notifications}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    topic:
      notifications: ${KAFKA_TOPIC_NOTIFICATIONS:blogger-hub-notifications}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jackson:
    property-naming-strategy: SNAKE_CASE

jwt:
  auth:
    accessTokenSecret: ${ACCESS_TOKEN_SECRET}
    refreshTokenSecret: ${REFRESH_TOKEN_SECRET}
    refreshTokenExpirationDays: ${REFRESH_TOKEN_EXPIRATION_DAYS}
    accessTokenExpirationMinutes: ${ACCESS_TOKEN_EXPIRATION_MINUTES}

cloudinary:
  cloud:
    name: ${CLOUDINARY_CLOUD_NAME}
    default-profile-pic: ${CLOUDINARY_DEFAULT_PROFILE_PIC}
  api:
    key: ${CLOUDINARY_API_KEY}
    secret: ${CLOUDINARY_API_SECRET}

server:
  port: ${PORT:8080}

otp:
  ttl: ${OTP_TTL:1}

aiven:
  basic:
    auth:
      user:
        info: ${AIVEN_BASIC_AUTH_USER_INFO}