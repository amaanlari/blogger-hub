# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys Blogger Hub as a single Docker web service. The image bundles a single-node Kafka
# broker (KRaft) next to the Spring Boot app, because a Render web service is one container and
# Render has no managed Kafka.
#
# MongoDB, Redis and Cloudinary stay external (Atlas / Redis Cloud / Cloudinary) — their
# connection details come in as environment variables below.
#
# To deploy: push this file to the repo, then Render Dashboard → New → Blueprint → pick the repo.
# Every `sync: false` var is prompted for at creation time and never stored in git.

services:
  - type: web
    name: blogger-hub
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore          # nearest to the existing ap-south-1 Redis; also: oregon, frankfurt, ohio, virginia
    plan: 1c-2g                # 1 CPU / 2GB. Two JVMs in one container do not fit the 512MB plans.
    branch: main
    # Kafka takes ~30-60s to format storage and become ready before Spring Boot even starts, so
    # the first successful health check on a cold deploy lands noticeably later than for a plain
    # Boot service. Render keeps probing until the deploy timeout, so this is fine — just don't
    # be alarmed by a minute of "service unavailable" in the logs.
    healthCheckPath: /actuator/health

    envVars:
      # --- JVM / container sizing -------------------------------------------------------------
      # Budgeted for the 2GB plan: 512MB Kafka heap + ~800MB app heap + metaspace/stacks/page
      # cache. Raise both together if you move to 2c-4g.
      - key: KAFKA_HEAP_OPTS
        value: -Xms256m -Xmx512m
      - key: JAVA_OPTS
        value: -XX:+UseContainerSupport -XX:MaxRAMPercentage=45 -XX:+ExitOnOutOfMemoryError

      # --- Kafka ------------------------------------------------------------------------------
      # The app reaches the broker over loopback inside the same container.
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: 127.0.0.1:9092
      - key: KAFKA_TOPIC_NOTIFICATIONS
        value: blogger-hub-notifications
      - key: KAFKA_CONSUMER_GROUP_ID
        value: blogger-hub-notifications
      # Must stay constant for the life of the service if you attach a disk (see below).
      - key: KAFKA_CLUSTER_ID
        value: MkU3OEVBNTcwNTJENDM2Qk

      # --- MongoDB (Atlas) ----------------------------------------------------------------------
      # Whitelist Render's outbound IPs in Atlas → Network Access, or allow 0.0.0.0/0.
      - key: MONGODB_URI
        sync: false

      # --- Redis ------------------------------------------------------------------------------
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_USERNAME
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: OTP_TTL
        value: "5"

      # --- JWT --------------------------------------------------------------------------------
      # Generate fresh values for production: `openssl rand -hex 64`. Do not reuse the ones
      # currently sitting in application-staging.yaml — they have been on disk in plain text.
      - key: ACCESS_TOKEN_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: ACCESS_TOKEN_EXPIRATION_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRATION_DAYS
        value: "7"

      # --- Cloudinary -------------------------------------------------------------------------
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_DEFAULT_PROFILE_PIC
        sync: false

      # --- Mail (SMTP) ------------------------------------------------------------------------
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

      # --- Gmail API --------------------------------------------------------------------------
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false

    # --- Optional: persistent Kafka log ----------------------------------------------------------
    # Without a disk the broker's log is ephemeral: every deploy and every restart starts from an
    # empty topic and loses consumer offsets. For a notification bus whose events are consumed
    # within seconds that is usually fine, and it keeps zero-downtime deploys working.
    #
    # If you do want the log to survive restarts, uncomment this AND read the note in
    # docs/RENDER_DEPLOYMENT.md about disk ownership vs. the image's non-root user. Attaching a
    # disk also disables zero-downtime deploys and pins the service to one instance.
    #
    # disk:
    #   name: kafka-data
    #   mountPath: /var/lib/kafka/data
    #   sizeGB: 5
